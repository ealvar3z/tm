# .github/workflows/static-pages.yml
name: Build & Deploy Static TM Site

on:
  # Runs on pushes to main and on manual dispatch
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '10 0 * * *'

# Grant only the permissions we need
permissions:
  contents: read        # to pull your code
  pages: write          # to push your build to GitHub Pages
  id-token: write       # required by deploy-pages action

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Sync environment
        run: uv sync

      - name: Initialize SQLite DB
        run: uv run python data/init_db.py

      - name: Build static site
        run: uv run python main.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

